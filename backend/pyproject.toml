[project]
name = "minecraft-server-manager"
version = "0.1.0"
description = "Secure control plane for self-hosted Minecraft Java servers"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "celery[redis]==5.6.3",
  "cryptography==50.0.1",
  "docker==7.2.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psutil==7.2.2",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.0.54",
  "typer==0.27.2",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
test = [
  "aiosqlite==0.22.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
]

[project.scripts]
minecraft-manager = "app.cli:app"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]
