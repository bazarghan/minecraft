[project]
name = "minecraft-server-manager"
version = "0.1.0"
description = "Secure control plane for self-hosted Minecraft Java servers"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "celery[redis]==5.4.0",
  "cryptography==44.0.1",
  "docker==7.1.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "psutil==6.1.1",
  "psycopg[binary]==3.2.5",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.38",
  "typer==0.15.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = [
  "aiosqlite==0.21.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.0.0",
]

[project.scripts]
minecraft-manager = "app.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]
