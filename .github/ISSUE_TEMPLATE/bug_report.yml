name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or paste secrets, cookies, worlds, or `.env` values here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes: {label: Version or commit, placeholder: v0.1.0 or commit SHA}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Authentication, Dashboard, Server lifecycle, Maps, Backups, Deployment, Documentation, Other]
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps, description: Include a safe request ID when available.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
